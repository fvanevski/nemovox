[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nvidia-transcribe"
version = "0.1.0"
description = "Local speaker-attributed multilingual dialogue and English subtitle generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0",  # YAML glossary loading is supported by both CLI and Studio
]

[project.optional-dependencies]
studio = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
nvidia-transcribe = "nvidia_transcribe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: tests requiring live GPU model inference",
]
